
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FindCar | Aluguel de Automóveis</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="aviso" class="alert d-none" role="alert"></div>

  <section id="login" class="login-page">
    <div class="login-panel">
      <img
        src="assets/img/findcarprincipal.png"
        alt="Logo FindCar"
        class="login-logo"
      >

      <h1>Bem-vindo ao FindCar</h1>
      <p class="login-subtitle">Acesse sua conta para continuar</p>

      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input id="email" type="email" class="form-control" required>
        </div>

        <div class="mb-4">
          <label for="senha" class="form-label">Senha</label>
          <input id="senha" type="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Entrar
        </button>
      </form>

      <div class="login-help">
        <strong>Contas de teste</strong>
        <p>Cliente: cliente@teste.com</p>
        <p>Agente: agente@teste.com</p>
        <p>Senha: 123456</p>
      </div>
    </div>
  </section>

  <div id="app" class="d-none">
    <header class="topbar">
      <img
        src="assets/img/findcarbranco.png"
        alt="FindCar"
        class="header-logo"
      >

      <div class="header-user">
        <span id="saudacao"></span>
        <button id="sair" type="button" class="btn btn-outline-light">
          Sair
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="page-heading">
        <h1 id="tituloArea"></h1>
        <p id="subtituloArea"></p>
      </div>

      <nav id="abas" class="tabs" aria-label="Navegação principal"></nav>
      <section id="conteudo"></section>
    </main>
  </div>

  <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="modalTitulo" class="modal-title"></h5>
          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
            aria-label="Fechar"
          ></button>
        </div>
        <div id="modalCorpo" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/dados.js"></script>
<script src="js/autenticacao.js"></script>
<script src="js/area-cliente.js"></script>
<script src="js/area-agente.js"></script>
<script src="js/app.js"></script>
</body>
</html>
